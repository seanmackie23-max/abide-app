<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d"), W = 1280, H = 720, DUR = 36;
const SERIF = '"GFS Baskerville", "Bitstream Charter", FreeSerif, serif';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const mix = (a, b, t) => a + (b - a) * t;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(mix(v, B[i], t))).join(",")})`; };
// deterministic pseudo-random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = Array.from({ length: 140 }, () => [rnd() * W, rnd() * H * 0.55, rnd() * 1.4 + .3, rnd()]);
const ridge = (base, amp, freq, phase) => x => base + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.7 + phase * 1.7) * amp * .35 + Math.sin(x * freq * 6.1 + phase) * amp * .12;
const far = ridge(430, 38, .006, 1.2), mid = ridge(480, 26, .009, 3.1), near = ridge(560, 18, .011, .4);
const stones = [[860, 600, 16, 30], [905, 612, 14, 24], [950, 598, 15, 32], [1000, 615, 13, 22], [300, 610, 14, 26], [255, 618, 12, 20]];

const CAPS = [
  [4.6, 8.6, "Welcome. Whoever you are, you are welcome here."],
  [8.9, 12.9, "On Sunday mornings we gather at half past ten, for about an hour."],
  [13.2, 17.4, "We sing, we read from the Bible, we pray, and there's a short talk."],
  [17.7, 21.7, "You don't need to know what to do. Just come as you are."],
  [22.0, 26.0, "Children are very welcome, and there's tea and coffee afterwards."],
  [26.3, 30.6, "If you'd like, tell us you're coming, and someone will meet you at the door."],
];

function hills(fn, color, yOff = 0) {
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) g.lineTo(x, fn(x) + yOff);
  g.lineTo(W, H); g.closePath(); g.fillStyle = color; g.fill();
}
function pointed(x, y, w, h) { // pointed arch window path, (x,y) = bottom-left
  const r = w * .8;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - h + w * .6);
  g.quadraticCurveTo(x, y - h, x + w / 2, y - h - w * .15);
  g.quadraticCurveTo(x + w, y - h, x + w, y - h + w * .6);
  g.lineTo(x + w, y); g.closePath();
}
function church(t, light) {
  const stone = mixc("#1d1f2b", "#6b6458", light), stoneLit = mixc("#22242f", "#8a7f6c", light), slate = mixc("#14161f", "#3d4250", light);
  const gx = 470, gy = 600; // nave bottom-left
  // nave body
  g.fillStyle = stone; g.fillRect(gx, gy - 150, 330, 150);
  // roof
  g.beginPath(); g.moveTo(gx - 14, gy - 150); g.lineTo(gx + 316, gy - 150); g.lineTo(gx + 330 + 10, gy - 150); g.lineTo(gx + 300, gy - 232); g.lineTo(gx + 60, gy - 232); g.closePath();
  g.fillStyle = slate; g.fill();
  // west gable (lit by sunrise from the right? keep warm)
  g.beginPath(); g.moveTo(gx - 120, gy); g.lineTo(gx - 120, gy - 170); g.lineTo(gx - 40, gy - 270); g.lineTo(gx + 40, gy - 170); g.lineTo(gx + 40, gy); g.closePath();
  g.fillStyle = stoneLit; g.fill();
  // crow steps
  g.fillStyle = stoneLit;
  for (let i = 0; i < 4; i++) { g.fillRect(gx - 120 + i * 18, gy - 178 - i * 22, 16, 10); g.fillRect(gx + 24 - i * 18, gy - 178 - i * 22, 16, 10); }
  // bellcote
  const bx = gx - 62, by = gy - 268;
  g.fillStyle = stoneLit; g.fillRect(bx, by - 54, 44, 58);
  g.beginPath(); g.moveTo(bx - 6, by - 54); g.lineTo(bx + 22, by - 82); g.lineTo(bx + 50, by - 54); g.closePath(); g.fill();
  g.fillStyle = "#07080c"; pointed(bx + 10, by - 6, 24, 34); g.fill();
  // bell swinging
  const swing = Math.sin(t * 5.2) * 0.35 * Math.exp(-t * 0.35);
  g.save(); g.translate(bx + 22, by - 36); g.rotate(swing);
  g.fillStyle = mixc("#6d5a2b", "#c9a24f", light * .8 + .2);
  g.beginPath(); g.moveTo(-8, 0); g.quadraticCurveTo(-9, 16, -12, 22); g.lineTo(12, 22); g.quadraticCurveTo(9, 16, 8, 0); g.closePath(); g.fill(); g.restore();
  // cross
  g.fillStyle = stoneLit; g.fillRect(bx + 20, by - 104, 4, 24); g.fillRect(bx + 13, by - 96, 18, 4);
  // gable window and door
  const glow = .55 + .45 * Math.sin(t * 1.3) * .1;
  const winGrad = (x, y, w, h) => { const gr = g.createLinearGradient(x, y - h, x, y); gr.addColorStop(0, `rgba(255,214,140,${.95 * glow})`); gr.addColorStop(1, `rgba(255,170,80,${.85 * glow})`); return gr; };
  pointed(gx - 62, gy - 150, 44, 70); g.fillStyle = winGrad(gx - 62, gy - 150, 44, 70); g.fill();
  g.strokeStyle = "rgba(20,18,16,.8)"; g.lineWidth = 2; g.beginPath(); g.moveTo(gx - 40, gy - 150); g.lineTo(gx - 40, gy - 222); g.stroke();
  pointed(gx - 58, gy, 36, 62); g.fillStyle = "#2a1c12"; g.fill();
  g.fillStyle = "rgba(255,200,120,.35)"; g.fillRect(gx - 41, gy - 58, 2, 58);
  // nave windows
  for (let i = 0; i < 4; i++) { const x = gx + 40 + i * 72; pointed(x, gy - 40, 30, 74); g.fillStyle = winGrad(x, gy - 40, 30, 74); g.fill(); }
  // window halos
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) { const x = i === 0 ? gx - 40 : gx + 55 + (i - 1) * 72, y = i === 0 ? gy - 190 : gy - 80;
    const rg = g.createRadialGradient(x, y, 0, x, y, 70); rg.addColorStop(0, `rgba(255,190,100,${.22 * (1 - light * .6)})`); rg.addColorStop(1, "rgba(255,190,100,0)"); g.fillStyle = rg; g.fillRect(x - 70, y - 70, 140, 140); }
  g.globalCompositeOperation = "source-over";
}
function celticCross(x, y, s, color) {
  g.fillStyle = color; g.fillRect(x - 3 * s, y - 46 * s, 6 * s, 46 * s); g.fillRect(x - 13 * s, y - 38 * s, 26 * s, 6 * s);
  g.strokeStyle = color; g.lineWidth = 3 * s; g.beginPath(); g.arc(x, y - 35 * s, 8 * s, 0, Math.PI * 2); g.stroke();
}
function draw(t) {
  const dawn = ease(clamp(t / 22)), light = ease(clamp((t - 4) / 24));
  const zoom = 1 + 0.1 * ease(t / DUR);
  g.save(); g.translate(W / 2, H * .62); g.scale(zoom, zoom); g.translate(-W / 2, -H * .62);
  // sky
  const sky = g.createLinearGradient(0, 0, 0, H * .75);
  sky.addColorStop(0, mixc("#070a1c", "#3a5a9a", dawn)); sky.addColorStop(.55, mixc("#141a3a", "#c98a7a", dawn)); sky.addColorStop(1, mixc("#2a2340", "#f2c27a", dawn));
  g.fillStyle = sky; g.fillRect(-100, -100, W + 200, H + 200);
  // stars
  for (const [x, y, r, p] of stars) { g.fillStyle = `rgba(255,255,240,${(1 - dawn * 1.4) * (.5 + .5 * Math.sin(t * 2 + p * 9))})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  // sun
  const sx = 1010, sy = mix(520, 360, dawn);
  const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 380); sg.addColorStop(0, `rgba(255,236,190,${.9 * dawn})`); sg.addColorStop(.12, `rgba(255,210,140,${.6 * dawn})`); sg.addColorStop(1, "rgba(255,180,120,0)");
  g.fillStyle = sg; g.fillRect(sx - 400, sy - 400, 800, 800);
  // rays
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 7; i++) { const a = -2.6 + i * .2 + Math.sin(t * .2 + i) * .02; g.fillStyle = `rgba(255,220,160,${.05 * dawn})`;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a) * 1400, sy + Math.sin(a) * 1400); g.lineTo(sx + Math.cos(a + .05) * 1400, sy + Math.sin(a + .05) * 1400); g.closePath(); g.fill(); }
  g.globalCompositeOperation = "source-over";
  // hills
  hills(far, mixc("#141833", "#6f6a8f", dawn * .8)); hills(mid, mixc("#10142a", "#4b5374", dawn * .8));
  // mist
  const mist = g.createLinearGradient(0, 470, 0, 560); mist.addColorStop(0, "rgba(220,215,230,0)"); mist.addColorStop(.6, `rgba(230,220,220,${.18 + .15 * dawn})`); mist.addColorStop(1, "rgba(220,215,230,0)");
  g.fillStyle = mist; g.fillRect(-100, 470, W + 200, 100);
  // birds
  for (let i = 0; i < 5; i++) { const bx = ((t * 38 + i * 70) % 1600) - 200, byy = 230 + i * 18 + Math.sin(t * 2 + i) * 6, f = Math.sin(t * 9 + i) * 5;
    g.strokeStyle = `rgba(20,20,30,${.6 * dawn})`; g.lineWidth = 2; g.beginPath(); g.moveTo(bx - 9, byy - f); g.lineTo(bx, byy); g.lineTo(bx + 9, byy - f); g.stroke(); }
  // churchyard ground
  hills(near, mixc("#0a0d12", "#2f3a2c", light * .9));
  // yew tree
  g.fillStyle = mixc("#06080a", "#1c2a1e", light); g.fillRect(1074, 590, 12, 40);
  for (const [cx, cy, r] of [[1080, 470, 48], [1050, 510, 52], [1110, 505, 50], [1078, 545, 62], [1040, 560, 40], [1120, 560, 42], [1082, 430, 34]]) { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); }
  church(t, light);
  // headstones
  for (const [x, y, w, h] of stones) { g.fillStyle = mixc("#0c0e14", "#4d4a44", light); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - h + w / 2); g.arc(x + w / 2, y - h + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w, y); g.closePath(); g.fill(); }
  celticCross(1150, 620, 1.1, mixc("#0c0e14", "#4d4a44", light));
  // path to door
  g.fillStyle = mixc("#0e1016", "#5a5246", light); g.beginPath(); g.moveTo(420, 720); g.lineTo(520, 720); g.lineTo(440, 601); g.lineTo(420, 601); g.closePath(); g.fill();
  // bell sound rings
  for (const tt of [.5, 3]) { const k = t - tt; if (k > 0 && k < 3) { g.strokeStyle = `rgba(255,230,180,${.35 * (1 - k / 3)})`; g.lineWidth = 1.5; g.beginPath(); g.arc(430, 300, 20 + k * 120, 0, 7); g.stroke(); } }
  g.restore();
  // vignette
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
  // fade from black
  if (t < 1.5) { g.fillStyle = `rgba(0,0,0,${1 - ease(t / 1.5)})`; g.fillRect(0, 0, W, H); }
  // lower third
  const lt = clamp((t - 1) / .8) * clamp((4.6 - t) / .6);
  if (lt > 0) { g.globalAlpha = lt; g.fillStyle = "rgba(8,9,14,.55)"; g.fillRect(70, 560, 520, 96); g.fillStyle = "#CFA857"; g.fillRect(70, 560, 3, 96);
    g.fillStyle = "#EDE5D2"; g.font = `34px ${SERIF}`; g.fillText("St Andrew's Parish Church", 96, 604);
    g.fillStyle = "#CFA857"; g.font = `17px ${SERIF}`; g.fillText("A WELCOME FROM THE MINISTER  ·  EXAMPLE", 98, 636); g.globalAlpha = 1; }
  // captions
  for (const [a, b, text] of CAPS) { const o = clamp((t - a) / .45) * clamp((b - t) / .45); if (o <= 0) continue;
    g.globalAlpha = o; g.font = `34px ${SERIF}`; const w = g.measureText(text).width;
    g.fillStyle = "rgba(8,9,14,.6)"; g.fillRect(W / 2 - w / 2 - 26, 616, w + 52, 58);
    g.fillStyle = "#F3ECDB"; g.textAlign = "center"; g.fillText(text, W / 2, 656); g.textAlign = "left"; g.globalAlpha = 1; }
  // end card
  const ec = clamp((t - 30.6) / 1.2);
  if (ec > 0) {
    g.fillStyle = `rgba(8,9,14,${.92 * ec})`; g.fillRect(0, 0, W, H); g.globalAlpha = ec;
    g.strokeStyle = "#CFA857"; g.lineWidth = 2; const aw = 400, ax = W / 2 - aw / 2;
    for (const [ins, al] of [[0, 1], [12, .45]]) { g.globalAlpha = ec * al; g.beginPath(); g.moveTo(ax + ins, 620); g.lineTo(ax + ins, 300); g.quadraticCurveTo(ax + ins, 150 + ins, W / 2, 95 + ins * 1.2); g.quadraticCurveTo(ax + aw - ins, 150 + ins, ax + aw - ins, 300); g.lineTo(ax + aw - ins, 620); g.stroke(); }
    g.globalAlpha = ec;
    g.textAlign = "center"; g.fillStyle = "#CFA857"; g.font = `18px ${SERIF}`; g.fillText("ALL ARE WELCOME", W / 2, 300);
    g.fillStyle = "#EDE5D2"; g.font = `46px ${SERIF}`; g.fillText("Sunday 10:30", W / 2, 380);
    g.font = `26px ${SERIF}`; g.fillStyle = "#D9D0BC"; g.fillText("St Andrew's Parish Church", W / 2, 428);
    g.font = `20px ${SERIF}`; g.fillStyle = "#CFA857"; g.fillText("Let them know you're coming, in Abide", W / 2, 500);
    g.textAlign = "left"; g.globalAlpha = 1;
  }
  // fade out
  if (t > DUR - 1.2) { g.fillStyle = `rgba(0,0,0,${ease((t - (DUR - 1.2)) / 1.2)})`; g.fillRect(0, 0, W, H); }
  // watermark
  g.fillStyle = "rgba(237,229,210,.55)"; g.font = `15px ${SERIF}`; g.textAlign = "right"; g.fillText("Illustration · the minister's own welcome goes here", W - 28, 40); g.textAlign = "left";
}
window.draw = draw; window.DUR = DUR;
draw(12);
</script></body></html>
