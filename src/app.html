<style>
/* Abide: a book of hours for thinking people.
   The page keeps the hours itself: limestone and ink by day, amber at dusk, the candlelit nave at night.
   Garamond for headings, a reading serif for long text, small capitals for labels, oxblood rubrics as in early printed books. */
:root {
  --bg: #ECE9E3; --surface: rgba(255,255,255,.55); --surface-2: #F7F5F1; --ink: #1D1B18; --ink-2: #34302B; --muted: #6E675D;
  --line: rgba(29,27,24,.14); --gold: #7C5D24; --gold-hi: #6B4F1D; --rubric: #8E2B2B;
  --btn-bg: #1D1B18; --btn-fg: #F3EEE5; --glass-o: .35; --season: #3E7A55;
  --display: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, serif;
  --read: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --caps: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-hour="dusk"] {
  --bg: #1C1713; --surface: rgba(255,240,220,.05); --surface-2: #261F19; --ink: #EFE5D3; --ink-2: #DCD0BB; --muted: #A89C88;
  --line: rgba(214,170,96,.22); --gold: #D2A65A; --gold-hi: #E9C987; --rubric: #E07B63;
  --btn-bg: linear-gradient(180deg, #E9C987, #D2A65A); --btn-fg: #1C140A; --glass-o: .8; color-scheme: dark;
}
:root[data-hour="night"] {
  --bg: #0B0C12; --surface: rgba(255,255,255,.035); --surface-2: #14151E; --ink: #EDE5D2; --ink-2: #E0D8C5; --muted: #A69F90;
  --line: rgba(207,168,87,.20); --gold: #CFA857; --gold-hi: #EBD196; --rubric: #D0566A;
  --btn-bg: linear-gradient(180deg, #EBD196, #CFA857); --btn-fg: #1A1406; --glass-o: .9; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; transition: background .6s; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
a { color: var(--gold-hi); }

.glass { position: fixed; inset: -10%; z-index: 0; pointer-events: none; filter: blur(34px); opacity: var(--glass-o);
  background:
    radial-gradient(28% 22% at 16% 6%, color-mix(in srgb, var(--season) 38%, transparent), transparent 70%),
    radial-gradient(24% 20% at 84% 12%, rgba(108,141,224,.22), transparent 70%),
    radial-gradient(22% 18% at 74% 64%, rgba(160,60,60,.12), transparent 70%),
    radial-gradient(50% 40% at 50% 0%, rgba(235,200,140,.16), transparent 70%);
  animation: drift 70s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(3%, 4%, 0) rotate(2deg); } }
.pillars { display: none; }

.app { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 130px; display: grid; gap: 28px; }
.label { font: 600 13px/1.2 var(--caps); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.rubric { font: 600 13px/1.2 var(--caps); letter-spacing: .14em; text-transform: uppercase; color: var(--rubric); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: grid; gap: 12px; }
.stone { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 18px; display: grid; gap: 10px; }
.ornament { display: flex; align-items: center; gap: 12px; color: var(--gold); opacity: .85; }
.ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
.ornament svg { width: 18px; height: 18px; }

/* Brand */
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand svg { width: 26px; height: 32px; color: var(--gold); }
.brand span { font: 600 18px/1 var(--caps); letter-spacing: .32em; }
.top { display: grid; gap: 10px; }
.top .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.top .date { font: 600 12.5px/1 var(--caps); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.season { display: inline-flex; align-items: center; gap: 9px; font: italic 15px/1.3 var(--display); color: var(--muted); }
.season i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--season); flex: none; }
.rhythm { font-size: 13px; color: var(--gold); }
.page-top { display: grid; gap: 8px; }
.page-top h1 { font-size: 42px; font-weight: 500; }
.page-top p { color: var(--muted); font: 400 16px/1.55 var(--read); }

/* Think / Live */
.duo-head { display: flex; align-items: baseline; gap: 12px; }
.duo-head .label { color: var(--rubric); }
.lancet { position: relative; width: 100%; color: #F2EADA; display: grid; gap: 8px; padding: 0 24px 26px; text-align: center; isolation: isolate; }
.lancet .glassfill { position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(60% 40% at 50% 18%, rgba(235,209,150,.35), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--season) 75%, #000) 0%, #1C2348 55%, #12131C 100%); }
.lancet .leads { position: absolute; inset: 0; z-index: -1; opacity: .16;
  background: repeating-linear-gradient(60deg, transparent 0 34px, #000 34px 36px), repeating-linear-gradient(-60deg, transparent 0 34px, #000 34px 36px); }
.lancet svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.lancet .rose-head { justify-self: center; width: 40%; max-width: 150px; aspect-ratio: 1; margin-bottom: 6px; filter: drop-shadow(0 0 18px rgba(235,209,150,.35)); }
.lancet .label { color: #EBD196; }
.lancet h2 { font-size: 34px; font-weight: 500; color: #F6EFE0; }
.lancet p { font: italic 19px/1.4 var(--display); color: #E9E1CE; }
.lancet .old { font: italic 14px/1.3 var(--display); color: #CFC6B2; opacity: .8; margin-top: 2px; }

.week { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--rubric); padding: 18px 18px 18px 20px; display: grid; gap: 10px; }
.week h3 { font-size: 25px; }
.week p { font: 400 15.5px/1.55 var(--read); color: var(--ink-2); }
.pips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pips i { width: 12px; height: 12px; transform: rotate(45deg); border: 1px solid var(--gold); }
.pips i.on { background: var(--gold); }
.pips i.today { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.week .row-btns { display: flex; gap: 10px; flex-wrap: wrap; }

.vow { display: grid; gap: 10px; padding: 20px; border: 1px solid var(--line); border-top: 3px double var(--rubric); background: var(--surface-2); }
.vow h3 { font-size: 24px; }
.vow p { font: 400 16px/1.6 var(--read); color: var(--ink-2); }
.seal { display: inline-flex; align-items: center; gap: 12px; justify-self: start; padding: 6px 18px 6px 6px; border-radius: 999px; border: 1px solid var(--rubric); color: var(--rubric); font: 600 14px/1 var(--caps); letter-spacing: .12em; text-transform: uppercase; }
.seal .wax { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #F3D9C7;
  background: radial-gradient(circle at 35% 30%, #B4413A, #7A1F1F 70%); box-shadow: inset 0 0 0 3px rgba(0,0,0,.15), inset 0 -3px 6px rgba(0,0,0,.25); }
.seal .wax svg { width: 18px; height: 22px; }
.seal[aria-pressed="true"] { background: color-mix(in srgb, var(--rubric) 12%, transparent); }

/* Today's path */
.path { position: relative; display: grid; }
.path::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(var(--line), var(--gold) 50%, var(--line)); opacity: .7; }
.step-row { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 0; width: 100%; }
.node { width: 31px; height: 31px; flex: none; display: grid; place-items: center; z-index: 1; }
.node .gem { width: 13px; height: 13px; transform: rotate(45deg); border: 1px solid var(--gold); background: var(--bg); }
.node .gem.done { background: var(--gold); }
.node .gem.next { background: var(--season); border-color: var(--gold); box-shadow: 0 0 12px var(--season); }
.node svg { width: 18px; height: 18px; color: var(--gold); background: var(--bg); border-radius: 50%; padding: 1px; }
.step-row .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.step-row .main b { font: 500 21px/1.15 var(--display); }
.step-row .main span { font-size: 13px; color: var(--muted); }
.step-row .end { font: 600 12.5px/1 var(--caps); letter-spacing: .1em; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-row.next .main b { color: var(--gold-hi); }
.step-row.aside .main b { font-size: 18px; font-style: italic; }

.verse { display: grid; gap: 10px; text-align: center; padding-inline: 8px; }
.verse p { font: 400 22px/1.45 var(--display); }
.verse span { font: 600 12.5px/1 var(--caps); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.illum::first-letter { font-family: var(--display); font-weight: 600; float: left; font-size: 2.6em; line-height: .9; margin: 4px 8px 0 0; padding: 4px 9px 6px; color: #F3E3BE; background: linear-gradient(135deg, #7A1F1F, #3A1E3A); border: 1px solid var(--gold); }
.foot-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot-links button { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }

.list { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; padding-block: 14px; border-bottom: 1px solid var(--line); width: 100%; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row .main b { font: 500 20px/1.2 var(--display); }
.row .main span { font-size: 13.5px; color: var(--muted); }
.chev { color: var(--gold); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg button { flex: none; padding: 8px 14px; border: 1px solid var(--line); font: 600 13.5px/1 var(--caps); letter-spacing: .08em; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.btn { display: block; width: 100%; text-align: center; padding: 15px; border-radius: 2px; background: var(--btn-bg); color: var(--btn-fg); font: 600 14px/1 var(--caps); letter-spacing: .16em; text-transform: uppercase; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); opacity: .9; }
.btns { display: grid; gap: 10px; }
.prayer-text { font: 400 23px/1.45 var(--display); }
.prayer-text.big { font-size: 27px; }
.src { font: 600 12px/1.3 var(--caps); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.response { font-weight: 600; color: var(--rubric); }
.hint { font-size: 13.5px; color: var(--muted); }
.draft { justify-self: start; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 3px 9px; }
.example { justify-self: start; font: 600 11.5px/1.3 var(--caps); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 6px 10px; }

.music-card { display: grid; gap: 7px; }
.music-card h3 { font-size: 23px; }
.music-card .by { font-size: 13.5px; color: var(--muted); }
.music-card p { font: 400 15px/1.55 var(--read); color: var(--ink-2); }
.listen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.listen a { font-size: 12.5px; font-weight: 500; text-decoration: none; color: var(--ink); border: 1px solid var(--line); padding: 6px 11px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs nav { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { display: grid; justify-items: center; gap: 4px; padding: 10px 0 9px; font-size: 10.5px; color: var(--muted); text-align: center; }
.tabs button[aria-current="page"] { color: var(--rubric); }
.tabs svg { width: 22px; height: 22px; }

.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.overlay[hidden], .entrance[hidden] { display: none !important; }
.overlay::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 45% at 50% 0%, color-mix(in srgb, var(--season) 16%, transparent), transparent 70%); }
.ov-bar { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 18px; max-width: 580px; width: 100%; margin: 0 auto; }
.ov-bar .close { font-size: 14px; color: var(--muted); padding: 6px 2px; }
.ov-bar .prog { flex: 1; height: 2px; background: var(--line); overflow: hidden; }
.ov-bar .prog i { display: block; height: 100%; background: var(--rubric); transition: width .4s ease; }
.ov-bar .ttl { flex: 1; text-align: center; font: 600 12.5px/1 var(--caps); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ov-body { position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ov-inner { max-width: 560px; margin: 0 auto; padding-inline: 24px; padding-block: 12px 32px; display: grid; gap: 18px; }
.ov-foot { position: relative; max-width: 560px; width: 100%; margin: 0 auto; padding: 12px 24px 18px; }
.step { animation: fade .5s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
textarea { width: 100%; min-height: 96px; padding: 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); color: var(--ink); font: 400 16px/1.5 var(--read); resize: vertical; }

.candle { position: relative; justify-self: center; width: 22px; height: 86px; margin-top: 40px; border-radius: 3px 3px 2px 2px; background: linear-gradient(90deg, #CFC3A8, #F2EAD8 45%, #BDB094); box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.candle::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 10px; background: #2A2620; transform: translateX(-50%); }
.flame { position: absolute; left: 50%; bottom: 100%; width: 16px; height: 34px; margin-left: -8px; margin-bottom: 6px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(60% 50% at 50% 70%, #FFF6D8, #FFC75A 45%, rgba(255,120,30,0) 75%); filter: drop-shadow(0 0 14px rgba(255,190,90,.9)); transform-origin: 50% 90%; animation: flicker 2.4s ease-in-out infinite; opacity: 0; transition: opacity 1.2s; }
.candle.lit .flame { opacity: 1; }
.candle .halo { position: absolute; left: 50%; bottom: 80%; width: 220px; height: 220px; margin-left: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,110,.25), transparent 65%); opacity: 0; transition: opacity 1.6s; pointer-events: none; }
.candle.lit .halo { opacity: 1; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-1deg); } 30% { transform: scale(1.05, .96) rotate(1.5deg); } 60% { transform: scale(.96, 1.04) rotate(-1.5deg); } }

.silence { display: grid; justify-items: center; gap: 22px; padding-block: 14px; text-align: center; }
.breath { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 30%, transparent), transparent 70%); border: 1px solid var(--gold); animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.72); } 50% { transform: scale(1.35); } }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

.overlay.night { --bg: #06070B; --ink: #E9E0CC; --ink-2: #DCD3BF; --muted: #A69F90; --line: rgba(207,168,87,.2); --gold: #CFA857; --gold-hi: #EBD196; --rubric: #D0566A; --surface: rgba(255,255,255,.04); --surface-2: #101119; --btn-bg: linear-gradient(180deg, #EBD196, #CFA857); --btn-fg: #1A1406; color: var(--ink); color-scheme: dark; }
.overlay.night::before { background: radial-gradient(50% 40% at 50% 20%, rgba(255,200,110,.10), transparent 70%); }
.moon { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset -14px -6px 0 0 var(--gold-hi); transform: rotate(-20deg); justify-self: center; opacity: .9; }

.lvl { display: flex; gap: 5px; }
.lvl i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--line); }
.lvl i.on { background: var(--gold); }
.memo-line { font: 400 23px/1.5 var(--display); }
.gap { display: inline-block; min-width: 2.6em; border-bottom: 1.5px solid var(--gold); color: transparent; line-height: 1.1; padding: 0 2px; cursor: pointer; }
.gap.shown { color: var(--gold-hi); border-bottom-color: transparent; }
.hidden-line { color: transparent; text-shadow: 0 0 12px color-mix(in srgb, var(--ink) 50%, transparent); cursor: pointer; user-select: none; }

.depth { display: grid; gap: 8px; padding-block: 18px; border-top: 1px solid var(--line); }
.depth .dh { display: flex; align-items: baseline; gap: 12px; }
.depth .n { font: 600 22px/1 var(--caps); color: var(--rubric); }
.depth h3 { font-size: 24px; }
.depth p { font: 400 17px/1.65 var(--read); color: var(--ink-2); }
.depth p + p { margin-top: 10px; }
.depth ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); font: 400 16px/1.55 var(--read); }
.depth a { color: var(--gold-hi); }
.depth .tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; justify-self: start; }
.why { border-left: 2px solid var(--rubric); padding: 4px 0 4px 16px; display: grid; gap: 8px; }
.why p { font: italic 20px/1.45 var(--display); }
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 3px; background: var(--line); }
.meter i.on { background: var(--rubric); }

.wall-item { display: grid; gap: 8px; }
.wall-item p { font: 400 19px/1.4 var(--display); }
.wall-item .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.prayed { font-size: 13px; border: 1px solid var(--gold); color: var(--gold-hi); padding: 6px 12px; border-radius: 2px; }
.prayed[aria-pressed="true"] { background: var(--gold); color: var(--bg); }
.member { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 14px/1 var(--caps); border: 1px solid var(--gold); color: var(--gold-hi); }
.member .main { flex: 1; }
.marks { display: flex; gap: 4px; }
.marks i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--line); }
.marks i.on { background: var(--gold); border-color: var(--gold); }
.big-number { font: 500 44px/1 var(--display); color: var(--gold-hi); font-variant-numeric: tabular-nums; }
video.parish { width: 100%; max-width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px; }

.entrance { position: fixed; inset: 0; z-index: 30; background: radial-gradient(60% 50% at 50% 38%, color-mix(in srgb, var(--gold) 10%, var(--bg)) 0%, var(--bg) 70%); color: var(--ink); display: grid; place-items: center; padding: 24px; padding-top: env(safe-area-inset-top, 24px); overflow: hidden; transition: opacity 1s ease; }
.entrance.leaving { opacity: 0; pointer-events: none; }
.entrance .xdoor { width: min(72vw, 300px); display: grid; justify-items: center; gap: 22px; text-align: center; }
.entrance svg.arch { width: 62%; height: auto; overflow: visible; color: var(--gold); }
.entrance .arch .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.2s ease forwards; }
.entrance .arch .line.l2 { animation-delay: .5s; } .entrance .arch .line.l3 { animation-delay: 1.1s; } .entrance .arch .line.l4 { animation-delay: 1.4s; }
.entrance .arch .glow { opacity: 0; animation: rays 2s ease 1.8s forwards; }
.entrance .wordmark { font: 600 20px/1 var(--caps); letter-spacing: .4em; color: var(--ink); opacity: 0; animation: rise 1.2s ease 2s forwards; padding-left: .4em; }
.entrance .words { display: grid; gap: 10px; opacity: 0; animation: rise 1.4s ease 2.6s forwards; }
.entrance .words h2 { font-size: 34px; }
.entrance .words p { font: italic 19px/1.4 var(--display); color: var(--muted); }

/* Ideas */

/* Churches near you */
.church { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); background: var(--surface); }

.event { display: grid; gap: 6px; padding: 16px 0; border-top: 1px solid var(--line); }

#view img, .plate img, .lookfig img { color: transparent; } /* never show alt text over a painting while it loads */

.top .tagline { font: italic 15px/1.2 var(--display); color: var(--muted); }

.ch-welcome { font: italic 18px/1.4 var(--display); color: var(--ink-2); }

/* Simplified: three tabs */

/* The entrance: the day's painting behind the door */

.entrance .ecredit { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1; font-size: 11.5px; color: rgba(244,238,226,.6); opacity: 0; animation: rise 1s ease 3.4s forwards; padding: 0 20px; }
@keyframes eart { to { opacity: 1; } }
@keyframes ezoom { from { transform: scale(1.06); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .entrance.painted::before { animation: eart .01s forwards; } }

/* Church: your first step */
.firststep { display: grid; gap: 10px; padding: 22px 20px; border: 1px solid var(--line); border-top: 3px double var(--rubric); background: var(--surface-2); }
.firststep h1 { font: 500 36px/1.05 var(--display); }
.firststep .lede { font: 400 17px/1.55 var(--read); color: var(--ink-2); }
.welcomer { padding: 12px 14px; background: var(--surface); border-left: 3px solid var(--season); font-size: 15.5px; }
.bridge { display: grid; gap: 4px; font: 400 15.5px/1.55 var(--read); color: var(--ink-2); }
.verified { color: var(--season); font-weight: 600; }
.allchurches > summary { cursor: pointer; font: 600 13px/1.2 var(--caps); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 8px 0; list-style: none; }

.allchurches[open] > summary::after { content: ""; }

.stone.note { border-top: 3px double var(--rubric); }

<script>
/* ================= Storage (per device; the app works without it) ================= */
const KEY = "abide.v1";
let store = { days: {}, learned: {}, prayedFor: {} };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function dayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return store.days[dayKey()] || { prayed: [], intention: "" }; }
function setToday(r) { store.days[dayKey()] = r; save(); }
function rhythmDays() {
  let d = new Date(), n = 0;
  if (!(store.days[dayKey(d)] || {}).prayed?.length) d.setDate(d.getDate() - 1);
  while ((store.days[dayKey(d)] || {}).prayed?.length) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
/* The page keeps the hours: day, dusk and night palettes */
const HOUR = (h => h < 5 || h >= 21 ? "night" : h >= 17 ? "dusk" : "day")(new Date().getHours());
document.documentElement.dataset.hour = HOUR === "day" && matchMedia("(prefers-color-scheme: dark)").matches ? "dusk" : HOUR;
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", e => { if (HOUR === "day") document.documentElement.dataset.hour = e.matches ? "dusk" : "day"; });
try { document.querySelector('meta[name="theme-color"]').content = { day: "#ECE9E3", dusk: "#1C1713", night: "#0B0C12" }[HOUR]; } catch (e) {}
/* The arch-A: a pointed window that is also the letter A; its mullion and transom quietly form a cross. */
const MARK = `<svg viewBox="0 0 60 76" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 74C6 40 20 14 30 2M54 74C54 40 40 14 30 2"/><path d="M9.3 46H50.7M30 2V74" stroke-width="2"/></svg>`;
const BRAND = `<span class="brand">${MARK}<span>ABIDE</span></span>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayOfYear = (d = new Date()) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);

/* ================= Content ================= */
const C = window.ABIDE_CONTENT;
const GRACES = C.prayers.graces, NIGHT = C.prayers.night, QUESTIONS = C.questions, MEMORY = C.memory, LIBRARY = C.library, VOICES = C.voices, MUSIC = C.music, CAL = C.calendar;
const ON_SITE = !!C.site;
const P = (text, ref) => ({ text, ref });
const LORDS_PRAYER = "Our Father, who art in heaven, hallowed be thy name; thy kingdom come; thy will be done; on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation; but deliver us from evil. For thine is the kingdom, the power and the glory, for ever and ever. Amen.";
const GLORIA = "Glory be to the Father, and to the Son, and to the Holy Spirit; as it was in the beginning, is now, and ever shall be, world without end. Amen.";

/* ================= The church year (src/churchyear.js) ================= */
/*__CHURCHYEAR__*/
const SEASON = season(), THEME = themeFor();
const THEME_COLOR = THEME.color || SEASON.color;
document.documentElement.style.setProperty("--season", THEME_COLOR);
const musicById = id => MUSIC.find(m => m.id === id);
const DAY_MUSIC = musicById(THEME.music[0]), NIGHT_MUSIC = musicById(THEME.music[1]) || DAY_MUSIC;
const DAY_LIB = LIBRARY.find(l => l.id === THEME.library) || LIBRARY[0];
/* Paintings from the National Gallery of Art, Washington (open access), downloaded by art.mjs and served by Abide */
const ART = C.art || { works: [], themes: {}, library: {}, playlists: {}, fallback: [] };
const MEDIA = (ART.base || "art/").replace(/art\/$/, "") + "media/";
const MUSIC_ART_POOL = () => (ART.music || []).map(id => ARTW[id]).filter(Boolean);
let MUSIC_ART = null;
const SEEN = new Set(); // paintings already on this screen: no painting appears twice on one screen
const ARTPOOL = () => [...(ART.fallback || []), ...Object.values(ART.weekdayPools || {}).flat(), ...Object.values(ART.series || {}), ...Object.values(ART.tradition || {})];
function uniqArt(...cands) { for (const c of [...cands, ...ARTPOOL()]) { const w = typeof c === "string" ? ARTW[c] : c; if (w && !SEEN.has(w.id)) { SEEN.add(w.id); return w; } } return null; }
const shortTitle = (t, n = 64) => { t = String(t || ""); if (t.length <= n) return t; const cut = t.split(/(?<=\.)\s|:\s/)[0].replace(/\.$/, ""); return cut.length <= n + 20 ? cut : t.slice(0, n).replace(/\s\S*$/, "") + "…"; };
const ARTW = Object.fromEntries(ART.works.map(w => [w.id, w]));
const iiif = (w, px = 900) => `${ART.base || "art/"}${w.id}-${px <= 600 ? 600 : 1400}.jpg`; // served by Abide (art.mjs)
const artFor = (kind, id) => ARTW[(ART[kind] || {})[id]] || null;
const THEME_ART = ARTW[ART.themes[THEME.id]] || (() => { const pool = (ART.weekdayPools || {})[new Date().getDay()] || ART.fallback || []; return ARTW[pool[weekNumber(new Date()) % (pool.length || 1)]]; })() || null;
const credit = w => w ? `${esc(w.artist)}, <i>${esc(w.title)}</i>, ${esc(w.date)}. National Gallery of Art, Washington` : "";
const pos = w => `object-position:${w.focus}${w.zoom ? `;transform:scale(${w.zoom})` : ""}`;
const paintingImg = (w, px = 900, cls = "") => w ? `<img class="${cls}" src="${iiif(w, px)}" alt="${esc(w.alt || w.title)}" style="${pos(w)}" decoding="async">` : "";

/* The four daily moments. Each is a short practice anyone can do; "Go deeper: pray it" opens the Christian prayer underneath.
   Compline keeps its unchanging ancient form. */
/* The four moments: one arc through the day. Centre and aim; return to centre; review; create tomorrow. */
const OFFICES = [
  { id: "morning", title: "Centre and aim", prayTitle: "Morning Prayer", time: "07:00", min: 7, invite: "Be still, hear one word, choose your cross, aim the day",
    seeker: [
      { type: "candle", text: "Before the noise begins, stop. This day has not happened yet." },
      { type: "breath", secs: 60, label: "Be still", text: "Breathe in for four, out for six. Let your mind arrive where your body is.", note: "“Be still, and know that I am God.” (Psalm 46:10)" },
      { type: "text", label: "A word for the morning", body: `<p class="prayer-text big illum">${THEME.psalm.text}</p><span class="src">${THEME.psalm.ref}</span><p class="hint">Read it twice, slowly. Keep one phrase with you.</p>` },
      { type: "idea" },
      { type: "write", label: "Take up your cross", key: "cross", prompt: "What is the one hard, right thing you have been putting off? Name it, and choose to carry it today.", hint: "Jesus told his followers to take up their cross daily (Luke 9:23). A life feels meaningful less because of what we feel than because of what we choose to carry well." },
      { type: "write", label: "Aim the day", key: "intention", prompt: `${THEME.intention} Finish the sentence: today I will…`, hint: "Make it small enough to do, and good enough to matter." },
    ],
    pray: ["opening", "psalm", "reading", "lords", "closing"],
    opening: ["O Lord, open my lips.", "And my mouth shall declare your praise."], psalm: THEME.psalm, reading: THEME.reading, music: DAY_MUSIC,
    closing: "Lord, I take up this day and what it asks of me. Give me courage for the hard thing, and love for the people I meet. Amen." },
  { id: "midday", title: "Return to centre", prayTitle: "Midday Prayer", time: "12:30", min: 3, invite: "Stop, remember your aim, carry on",
    seeker: [
      { type: "breath", secs: 60, label: "Stop", text: "Put the phone face down after this. Breathe slowly for a minute and come back to yourself.", note: "The monks stopped work at midday to pray. The world can wait sixty seconds." },
      { type: "recall" },
      { type: "text", label: "A word for the middle of the day", body: `<p class="prayer-text big">${THEME.midday.text}</p><span class="src">${THEME.midday.ref}</span>` },
    ],
    pray: ["opening", "lords", "closing"],
    opening: ["O God, make speed to save us.", "O Lord, make haste to help us."], psalm: P("Be still, and know that I am God.", "Psalm 46:10"), reading: THEME.midday, music: DAY_MUSIC,
    closing: "Lord, bless the work of my hands this afternoon, and keep me faithful to what I chose this morning. Amen." },
  { id: "evening", title: "Review", prayTitle: "Evening Prayer", time: "18:00", min: 6, invite: "Give thanks, look honestly, put something right",
    seeker: [
      { type: "text", label: "An ancient practice", body: `<p class="prayer-text">Each night the Roman philosopher Seneca reviewed his day: what he did well, where he fell short, what he would do better.</p><p class="hint">Christians took up the same practice. Ignatius of Loyola made it the examen, done in God's presence and beginning with thanks.</p>` },
      { type: "write", label: "Thanks", key: "e0", prompt: "What was good today? Who or what are you grateful for?" },
      { type: "write", label: "Your cross", key: "e1", prompt: "@cross", hint: "No excuses and no self-punishment. Just the truth, so tomorrow can be better." },
      { type: "write", label: "Put it right", key: "e2", prompt: "Is there someone to thank, or something to put right? What will you do about it?" },
    ],
    pray: ["opening", "reading", "silence", "lords", "closing"],
    opening: ["Let my prayer be set before you like incense;", "the lifting up of my hands like the evening sacrifice."], psalm: P("Let my prayer be set before you like incense.", "Psalm 141:2"), reading: THEME.evening, music: NIGHT_MUSIC,
    closing: "May the peace of God, which surpasses all understanding, guard my heart and mind in Christ Jesus. Amen." },
  { id: "compline", title: "Create tomorrow", prayTitle: "Compline", time: "21:30", min: 4, invite: "Set tomorrow's aim, then let the day go",
    seeker: [
      { type: "candle", text: "The day is done. What was good stays good. What went wrong can be mended tomorrow." },
      { type: "write", label: "Tomorrow", key: "tomorrow", prompt: "What is the one thing that matters most tomorrow? Write it now, so you wake with an aim. It will be waiting for you in the morning.", hint: "“A man's heart plans his course, but the Lord directs his steps.” (Proverbs 16:9)" },
      { type: "write", label: "Let it go", key: "letgo", prompt: "Name whatever is still on your mind. Write it down and leave it here until morning.", hint: "“Don't be anxious for tomorrow, for tomorrow will be anxious for itself.” (Matthew 6:34)" },
      { type: "breath", secs: 60, label: "Rest", text: "Breathe slowly. Let your shoulders drop. You have done enough for today.", note: "“In peace I will both lay myself down and sleep.” (Psalm 4:8)" },
    ],
    pray: ["opening", "psalm", "reading", "lords", "closing"],
    opening: ["The Lord Almighty grant us a quiet night", "and a perfect end."], psalm: P("In peace I will both lay myself down and sleep, for you alone, Lord, make me live in safety.", "Psalm 4:8"),
    reading: P("Now you are releasing your servant, Master, according to your word, in peace; for my eyes have seen your salvation.", "Luke 2:29–30"), music: NIGHT_MUSIC,
    closing: "Into your hands, Lord, I commend my spirit. Keep me as the apple of your eye; hide me under the shadow of your wings. Amen." },
];
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function suggestedOffice() {
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  if (m < 300) return OFFICES[3];
  let s = OFFICES[0]; for (const o of OFFICES) if (toMin(o.time) - 30 <= m) s = o; return s;
}

/* ================= Art: rose window, arches, bell ================= */
function roseWindow(cls = "") {
  let p = "";
  const jewels = ["var(--season)", "#2B4C9E", "#8E2B3E", "#2B4C9E", "#5B3F8C", "#2B4C9E"];

/* Run one agent turn. history: [{role, content: string}] ending with the user's turn. onStatus shows progress. */
async function runAgent(name, history, { onText, onStatus, signal } = {}) {
  const def = AG.defs[name];
  const wrap = (fn, label) => async input => { onStatus && onStatus(label(input)); return fn(input || {}); };
  const labels = { search_ideas: i => `Searching Abide for “${String(i.query || "").slice(0, 40)}”…`, read_entry: i => `Reading ${(ideaIndex().find(e => e.ref === i.ref) || { title: "an entry" }).title}…`, get_my_rhythm: () => "Looking at your week…", list_catalogue: () => "Looking through everything in Abide…" };
  if (AGENT === "sample") {
    const turns = history.map((m, i) => i === 0 ? { role: "user", content: def.system + "\n\n---\n\n" + m.content } : m);
    if (!SAMPLE_TOOLS) { // no page tools here: ground the answer by putting the best entries in the prompt
      const q = history[history.length - 1].content, hits = searchIdeas(q).slice(0, 3).map(h => readEntry(h.ref));
      const extra = name === "coach" ? "\n\nMy rhythm: " + JSON.stringify(myRhythm()) : name === "path" ? "\n\nMy rhythm: " + JSON.stringify(myRhythm()) + "\n\nThe catalogue: " + JSON.stringify(catalogue()) : "";
      turns[turns.length - 1] = { role: "user", content: turns[turns.length - 1].content + extra + "\n\nAbide entries you may draw on (cite by ref):\n" + JSON.stringify(hits) };
      return (await SAMPLE(turns, { onText, signal, cache: false })).text;
    }
    const tools = def.tools.map(n => ({ name: n, description: AG.tools[n].description, inputSchema: AG.tools[n].input_schema, execute: wrap(TOOL_FNS[n], labels[n]) }));
    return (await SAMPLE(turns, { onText, signal, tools })).text;
  }
  if (AGENT === "relay") {
    const msgs = history.map(m => ({ role: m.role, content: m.content }));
    for (let round = 0; round < 6; round++) {
      const r = await fetch(AG.endpoint, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ agent: name, messages: msgs, plus: (plusInfo() || {}).key }), signal });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw { code: r.status === 402 ? "upgrade" : r.status === 429 ? "rate_limited" : "relay", message: data.error || "Abide could not reach Claude just now." };
      msgs.push({ role: "assistant", content: data.content });
      const uses = (data.content || []).filter(b => b.type === "tool_use");
      if (data.stop_reason !== "tool_use" || !uses.length) { const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n\n"); onText && onText({ text }); return text; }
      const results = [];
      for (const u of uses) { try { results.push({ type: "tool_result", tool_use_id: u.id, content: JSON.stringify(await wrap(TOOL_FNS[u.name] || (() => { throw new Error("Unknown tool"); }), labels[u.name] || (() => "Thinking…"))(u.input)) }); }
        catch (e) { results.push({ type: "tool_result", tool_use_id: u.id, content: "Error: " + (e.message || e), is_error: true }); } }
      msgs.push({ role: "user", content: results });
    }
    throw { code: "relay", message: "That took too many steps. Try asking more simply." };
  }
  throw { code: "not_granted", message: "Ask Abide is not available here." };
}
const agentError = e => e && e.code === "upgrade" ? "You've used today's free questions." : e && e.code === "not_granted" ? "Ask Abide needs your permission to use Claude. You can allow it next time you ask."

let session = null, silenceTimer = null;
function startPrayer(id) {

  const w = activeWeek();

  const r0 = today(), yesterday = store.days[dayKey(addDays(new Date(), -1))] || {};
  const answers = id === "morning" ? { intention: r0.intention || yesterday.tomorrow || "", cross: r0.cross || "" } : {};

}
function breathHTML(st) {

}
function drawStep() {

  switch (st.type) {
    case "candle":

    case "text": html = `<span class="rubric">${st.label}</span>${st.body}`; break;
    case "breath": html = breathHTML(st); break;
    case "idea": html = `<span class="rubric">Today's idea</span><h2 style="font-size:32px">${THEME.idea}</h2><p class="prayer-text">${THEME.ideaLine}</p>${ornament()}<span class="label">An ancient word</span><p class="prayer-text illum">${THEME.reading.text}</p><span class="src">${THEME.reading.ref}</span>`; break;
    case "write": { const cr = today().cross;

      const pre = session.o.id === "morning" && st.key === "intention" && !today().intention && (store.days[dayKey(addDays(new Date(), -1))] || {}).tomorrow ? `<p class="hint">Last night you wrote this for today. Keep it, or change it.</p>` : "";
      html = `<span class="rubric">${st.label}</span><p class="prayer-text">${prompt}</p>${st.hint ? `<p class="hint">${st.hint}</p>` : ""}${pre}<label class="hint" for="ans">Write a few words, or simply think them.</label><textarea id="ans" placeholder="A few words…">${esc(session.answers[st.key] || "")}</textarea>`; break; }
    case "recall": { const r = today();
      html = r.cross || r.intention ? `<span class="rubric">Remember your aim</span><p class="prayer-text">This morning you chose:</p>${r.cross ? `<p class="hint" style="margin-bottom:-8px">Your cross</p><p class="prayer-text" style="color:var(--gold-hi);font-style:italic">“${esc(r.cross)}”</p>` : ""}${r.intention ? `<p class="hint" style="margin-bottom:-8px">Your aim</p><p class="prayer-text" style="color:var(--gold-hi);font-style:italic">“${esc(r.intention)}”</p>` : ""}<p class="hint">Is there still time for it this afternoon? What is the next small step?</p>`
        : `<span class="rubric">Remember your aim</span><p class="prayer-text">What is the one thing that matters most this afternoon?</p><p class="hint">Not the most urgent thing: the most important one.</p>`; break; }
    case "return": { const it = today().intention;

    case "choice":
      html = `<div style="text-align:center;display:grid;gap:16px;padding-top:4vh"><span class="label">Go deeper</span><p class="prayer-text big">Would you like to pray it?</p>
        <p class="muted">Every moment in Abide has a Christian prayer underneath it, prayed for centuries at this hour. It takes ${o.id === "midday" ? "a minute" : "three minutes"}. You can simply read it, and see.</p></div>`;
      foot = `<div class="btns"><button class="btn" id="prayit">Pray it</button><button class="btn ghost" id="finish">Finish here</button></div>`; break;
    case "opening": html = `<span class="rubric">${o.prayTitle} · The opening</span><p class="prayer-text big">${o.opening[0]}</p><p class="prayer-text big response">${o.opening[1]}</p><p class="hint">Lines in gold are yours to say, aloud or in your heart.</p>`; break;
    case "psalm": html = `<span class="rubric">The psalm</span><p class="prayer-text big illum">${o.psalm.text}</p><span class="src">${o.psalm.ref}</span>${ornament()}<p class="prayer-text response" style="font-size:20px">${GLORIA}</p>`; break;
    case "reading": html = `<span class="rubric">The word · ${THEME.idea}</span><p class="prayer-text big">${o.reading.text}</p><span class="src">${o.reading.ref}</span>`; break;
    case "silence": html = breathHTML({ label: "Silence", secs: 60, text: "Be still, and know that I am God." }); break;
    case "lords": html = `<span class="rubric">The Lord's Prayer</span><p class="hint">The prayer Jesus taught his friends, said by Christians every day for two thousand years.</p><p class="prayer-text response">${LORDS_PRAYER}</p>`; break;
    case "closing": html = `<span class="rubric">The blessing</span><p class="prayer-text big">${o.closing}</p>${ornament()}${musicCard(o.music, "To stay a while")}`; break;
  }
  ovBody.innerHTML = `<div class="ov-inner step">${html}</div>`;
  ovBody.scrollTop = 0;
  ovFoot.innerHTML = foot || `<button class="btn" id="next">${last ? (session.prayed ? "Amen" : "Finish") : btn}</button>`;
  if (st.type === "breath" || st.type === "silence") {
    let left = st.secs || 60; const c = document.getElementById("count");
    silenceTimer = setInterval(() => { left--; if (c) c.textContent = left > 0 ? left + "s" : "Continue when you are ready."; if (left <= 0) { clearInterval(silenceTimer); ringBell(); } }, 1000);

}
function finishPractice() {
  const r = today(), o = session.o, a = session.answers;
  if (!r.prayed.includes(o.id)) r.prayed.push(o.id);
  if (a.intention) r.intention = a.intention;

ovFoot.addEventListener("click", e => {

  const st = session.steps[session.i];

const spUri = m => "spotify:track:" + m.spotify;
function spotifyReady(first) {

      spFrame = host.querySelector("iframe"); resolve(null);

    toast(r.welcomer ? `They know you're coming. ${r.welcomer.name} will look out for you.` : "They know you're coming. You'll be welcome."); }
  catch (err) { toast("We couldn't reach them just now."); }
}
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-circleform],[data-prayform]"); if (!f) return; e.preventDefault();
  if (f.dataset.circleform) {
    const name = f.name.value.trim(); store.myName = name; save();
    try {
      circleView = await circleCall(f.dataset.circleform === "new" ? "circle_new" : "circle_join", f.dataset.circleform === "new" ? { name, circle: f.circle.value } : { name, code: (f.code ? f.code.value : inviteCode).trim() });
      store.circle = { code: circleView.code, name: circleView.name }; save(); circleForm = "";
      if (inviteCode) history.replaceState(null, "", location.pathname);
      toast(f.dataset.circleform === "new" ? "Your circle is ready. Now invite someone." : `Welcome to ${circleView.name}.`); render();
    } catch (err) {}
  }
  if (f.matches("[data-prayform]")) { const text = f.text.value.trim(); if (!text) return; try { circleView = await circleCall("circle_pray", { text }); toast("Your circle will pray for this."); render(); } catch (err) {} }
});
document.addEventListener("click", async e => {
  if (e.target.closest("[data-tellcoming]")) return tellComing(e.target.closest("[data-tellcoming]").dataset.tellcoming);
  const b = e.target.closest("[data-circlenew],[data-circlejoin],[data-invite],[data-cprayed],[data-unpray],[data-leave],[data-going],[data-gotogether],[data-fsnext],[data-checkin],[data-jump],[data-tab-go]"); if (!b) return;
  if (b.hasAttribute("data-circlenew")) { if (needPlus("Starting a circle is part of Abide Plus. Anyone you invite joins free.")) return; circleForm = "new"; return render(); }
  if (b.hasAttribute("data-circlejoin")) { circleForm = "join"; return render(); }
  if (b.hasAttribute("data-invite")) return shareText(`Join my circle on Abide: we live one good idea a day together, a few minutes each, and pray for each other. ${store.myName ? "– " + store.myName : ""}`, circleLink());
  if (b.dataset.cprayed) { try { circleView = await circleCall("circle_prayed", { id: b.dataset.cprayed }); render(); } catch (err) {} return; }
  if (b.dataset.unpray) { try { circleView = await circleCall("circle_unpray", { id: b.dataset.unpray }); render(); } catch (err) {} return; }
  if (b.hasAttribute("data-leave")) { if (!confirm("Leave this circle? You can rejoin with the invitation link.")) return; try { await circleCall("circle_leave"); } catch (err) {} store.circle = null; circleView = null; save(); return render(); }
  const ev = id => weekEvents().find(x => x.id === id);
  if (b.dataset.going) { const x = ev(b.dataset.going); if (x) toggleGoing(x); return; }
  if (b.hasAttribute("data-fsnext")) { fsIdx++; return render(); }
  if (b.dataset.gotogether) { const x = ev(b.dataset.gotogether); if (!x) return; if (!isGoing(x.id)) await toggleGoing(x);
    return shareText(`I'm going to ${x.title} at ${x.church}, ${whenLabel(x.date, x.time)}. Come with me?`, x.url || location.origin + location.pathname); }
  if (b.dataset.checkin) { store.checked = Object.assign(store.checked || {}, { [b.dataset.checkin]: b.dataset.v }); if (b.dataset.v === "went") { store.visits = [...(store.visits || []), { id: b.dataset.checkin, at: dayKey() }];
      { const cid = b.dataset.checkin.split("|")[0]; if (LIVE && (near.verified || {})[cid]) relayAction({ action: "church_went", id: cid, device: store.device }).catch(() => {}); } toast((store.visits.length === 1 ? "Your first visit. Well done." : "Good to hear.") + " What helped? Tell your circle."); } else toast("No matter. There's always next week."); save(); return render(); }
  if (b.dataset.jump) { const el = document.getElementById(b.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); if (b.dataset.jump === "com-circle" && !store.circle) { circleForm = "new"; render(); document.getElementById("com-circle")?.scrollIntoView({ block: "start" }); } return; }
  if (b.dataset.tabGo) return go(b.dataset.tabGo);
});
loadCircle();
if (inviteCode) { comSeg = "circles"; setTimeout(() => go("community"), 0); }

/* ================= Render ================= */
function render() {
  SEEN.clear();
  ({ today: renderToday, explore: renderExplore, church: renderCommunity })[tab]();
}
renderTabs(); render();
if (C.site && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (store.entered !== dayKey()) showEntrance(); else if (!store.welcomed) openWelcome();
</script>
