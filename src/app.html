<title>Abide</title>

<meta name="apple-mobile-web-app-title" content="Abide">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0C12">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a candlelit nave. One dark stone column, light falling through stained glass in the season's colour,
   inscriptions in carved capitals (Cinzel), Scripture in Garamond, rubrics in red as in old prayer books. */
:root {
  --bg: #0B0C12;
  --stone: #14151E;
  --ink: #EDE5D2;
  --muted: #A69F90;
  --line: rgba(207, 168, 87, .20);
  --gold: #CFA857;
  --gold-hi: #EBD196;
  --ruby: #D0566A;
  --sapphire: #6C8DE0;
  --season: #3E7A55;
  --inscr: "Cinzel", "Trajan Pro", Georgia, serif;
  --display: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, serif;
  --body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; line-height: 1.12; text-wrap: balance; }
p { margin: 0; }
a { color: var(--gold-hi); }

/* Light through the windows */
.glass { position: fixed; inset: -10%; z-index: 0; pointer-events: none; filter: blur(30px); opacity: .9;
  background:
    radial-gradient(28% 22% at 18% 8%, color-mix(in srgb, var(--season) 40%, transparent), transparent 70%),
    radial-gradient(24% 20% at 82% 14%, rgba(108,141,224,.22), transparent 70%),
    radial-gradient(22% 18% at 74% 62%, rgba(208,86,106,.12), transparent 70%),
    radial-gradient(26% 20% at 22% 78%, rgba(140,107,199,.13), transparent 70%),
    radial-gradient(50% 40% at 50% 0%, rgba(235,209,150,.08), transparent 70%);
  animation: drift 70s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(3%, 4%, 0) rotate(2deg); } }
.pillars { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 11%, rgba(255,255,255,.018) 11% 11.4%, transparent 11.4% 25%); mask: linear-gradient(transparent, #000 30%, #000 70%, transparent); }

.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding-inline: 18px; padding-block: 22px 130px; display: grid; gap: 26px; }
.label { font: 500 11px/1.2 var(--inscr); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
.rubric { font: 500 11px/1.2 var(--inscr); letter-spacing: .22em; text-transform: uppercase; color: var(--ruby); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: grid; gap: 12px; }
.stone { background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018)); border: 1px solid var(--line); border-radius: 3px; padding: 18px; display: grid; gap: 10px; }
.ornament { display: flex; align-items: center; gap: 12px; color: var(--gold); opacity: .8; }
.ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
.ornament svg { width: 18px; height: 18px; }

/* Header */
.top { position: relative; display: grid; gap: 6px; }
.top .date { font: 500 12px/1 var(--inscr); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.top h1 { font-size: 48px; font-weight: 400; letter-spacing: .01em; }
.season { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); }
.season i { width: 9px; height: 9px; transform: rotate(45deg); background: var(--season); box-shadow: 0 0 12px var(--season); flex: none; }
.rhythm { font-size: 13px; color: var(--gold); }
.page-top { display: grid; gap: 8px; }
.page-top h1 { font-size: 40px; font-weight: 400; }
.page-top p { color: var(--muted); font-size: 15px; }

/* The lancet window: today's theme */
.lancet { position: relative; width: 100%; color: var(--ink); display: grid; gap: 8px; padding: 0 24px 26px; text-align: center; isolation: isolate; }
.lancet .glassfill { position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(60% 40% at 50% 18%, rgba(235,209,150,.35), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--season) 75%, #000) 0%, #1C2348 55%, #12131C 100%); }
.lancet .leads { position: absolute; inset: 0; z-index: -1; opacity: .16;
  background: repeating-linear-gradient(60deg, transparent 0 34px, #000 34px 36px), repeating-linear-gradient(-60deg, transparent 0 34px, #000 34px 36px); }
.lancet svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.lancet .rose-head { justify-self: center; width: 46%; max-width: 170px; aspect-ratio: 1; margin-bottom: 8px; filter: drop-shadow(0 0 18px rgba(235,209,150,.35)); }
.lancet .label { color: var(--gold-hi); }
.lancet h2 { font-size: 34px; font-weight: 500; }
.lancet p { font-family: var(--display); font-size: 19px; line-height: 1.4; color: #E9E1CE; font-style: italic; }

/* Today's path */
.path { position: relative; display: grid; }
.path::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(var(--line), var(--gold) 50%, var(--line)); opacity: .6; }
.step-row { position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 0; width: 100%; }
.node { width: 31px; height: 31px; flex: none; display: grid; place-items: center; z-index: 1; }
.node .gem { width: 13px; height: 13px; transform: rotate(45deg); border: 1px solid var(--gold); background: var(--bg); }
.node .gem.done { background: var(--gold); box-shadow: 0 0 12px rgba(207,168,87,.6); }
.node .gem.next { background: var(--season); border-color: var(--gold-hi); box-shadow: 0 0 14px var(--season); }
.node svg { width: 18px; height: 18px; color: var(--gold); background: var(--bg); border-radius: 50%; padding: 1px; }
.step-row .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.step-row .main b { font-family: var(--display); font-size: 20px; font-weight: 500; }
.step-row .main span { font-size: 13px; color: var(--muted); }
.step-row .end { font: 500 12px/1 var(--inscr); letter-spacing: .1em; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-row.next .main b { color: var(--gold-hi); }
.step-row.aside .main b { font-size: 17px; font-style: italic; }

.verse { display: grid; gap: 10px; text-align: center; padding-inline: 8px; }
.verse p { font-family: var(--display); font-size: 23px; line-height: 1.4; }
.verse span { font: 500 11px/1 var(--inscr); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.illum::first-letter { font-family: var(--inscr); float: left; font-size: 2.3em; line-height: 1; margin: 4px 8px 0 0; padding: 4px 8px; color: var(--gold-hi); background: linear-gradient(135deg, #1D2A5C, #3A1E3A); border: 1px solid var(--gold); }
.foot-links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot-links button { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }

/* Lists, segments, buttons */
.list { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; padding-block: 14px; border-bottom: 1px solid var(--line); width: 100%; }
.row .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.row .main b { font-family: var(--display); font-size: 19px; font-weight: 500; }
.row .main span { font-size: 13px; color: var(--muted); }
.chev { color: var(--gold); }
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg button { flex: none; padding: 8px 14px; border-radius: 2px; border: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.btn { display: block; width: 100%; text-align: center; padding: 15px; border-radius: 2px; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); color: #1A1406; font: 600 13px/1 var(--inscr); letter-spacing: .18em; text-transform: uppercase; }
.btn.ghost { background: transparent; color: var(--gold-hi); border: 1px solid var(--gold); }
.btns { display: grid; gap: 10px; }
.prayer-text { font-family: var(--display); font-size: 23px; line-height: 1.45; }
.prayer-text.big { font-size: 27px; }
.src { font: 500 11px/1.3 var(--inscr); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.response { font-weight: 600; color: var(--gold-hi); }
.hint { font-size: 13.5px; color: var(--muted); }
.draft { justify-self: start; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 3px 9px; }
.example { justify-self: start; font: 500 10.5px/1.3 var(--inscr); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 6px 10px; }

/* Music */
.music-card { display: grid; gap: 7px; }
.music-card h3 { font-size: 23px; }
.music-card .by { font-size: 13.5px; color: var(--muted); }
.music-card p { font-size: 15px; color: #D8D0BE; }
.listen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.listen a { font-size: 12.5px; font-weight: 500; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 6px 11px; }
.listen a:hover { border-color: var(--gold); color: var(--gold-hi); }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: linear-gradient(180deg, rgba(11,12,18,.75), rgba(11,12,18,.97)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tabs button { display: grid; justify-items: center; gap: 4px; padding: 10px 0 9px; font-size: 10.5px; color: var(--muted); text-align: center; letter-spacing: .02em; }
.tabs button[aria-current="page"] { color: var(--gold-hi); }
.tabs svg { width: 22px; height: 22px; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.overlay[hidden], .entrance[hidden] { display: none !important; }
.overlay::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 45% at 50% 0%, color-mix(in srgb, var(--season) 22%, transparent), transparent 70%); }
.ov-bar { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 18px; max-width: 560px; width: 100%; margin: 0 auto; }
.ov-bar .close { font-size: 14px; color: var(--muted); padding: 6px 2px; }
.ov-bar .prog { flex: 1; height: 2px; background: var(--line); overflow: hidden; }
.ov-bar .prog i { display: block; height: 100%; background: var(--gold); transition: width .4s ease; }
.ov-bar .ttl { flex: 1; text-align: center; font: 500 11px/1 var(--inscr); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.ov-body { position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ov-inner { max-width: 520px; margin: 0 auto; padding-inline: 24px; padding-block: 12px 32px; display: grid; gap: 18px; }
.ov-foot { position: relative; max-width: 520px; width: 100%; margin: 0 auto; padding: 12px 24px 18px; }
.step { animation: fade .5s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
textarea { width: 100%; min-height: 96px; padding: 14px; border: 1px solid var(--line); border-radius: 2px; background: rgba(255,255,255,.04); color: var(--ink); font: 400 16px/1.5 var(--body); resize: vertical; }

/* Candle */
.candle { position: relative; justify-self: center; width: 22px; height: 86px; margin-top: 40px; border-radius: 3px 3px 2px 2px; background: linear-gradient(90deg, #CFC3A8, #F2EAD8 45%, #BDB094); }
.candle::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 10px; background: #2A2620; transform: translateX(-50%); }
.flame { position: absolute; left: 50%; bottom: 100%; width: 16px; height: 34px; margin-left: -8px; margin-bottom: 6px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(60% 50% at 50% 70%, #FFF6D8, #FFC75A 45%, rgba(255,120,30,.0) 75%); filter: drop-shadow(0 0 14px rgba(255,190,90,.9)); transform-origin: 50% 90%; animation: flicker 2.4s ease-in-out infinite; opacity: 0; transition: opacity 1.2s; }
.candle.lit .flame { opacity: 1; }
.candle .halo { position: absolute; left: 50%; bottom: 80%; width: 220px; height: 220px; margin-left: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,110,.22), transparent 65%); opacity: 0; transition: opacity 1.6s; pointer-events: none; }
.candle.lit .halo { opacity: 1; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-1deg); } 30% { transform: scale(1.05, .96) rotate(1.5deg); } 60% { transform: scale(.96, 1.04) rotate(-1.5deg); } }

/* Silence */
.silence { display: grid; justify-items: center; gap: 22px; padding-block: 14px; text-align: center; }
.breath { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(235,209,150,.28), transparent 70%); border: 1px solid var(--gold); animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.72); } 50% { transform: scale(1.35); } }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

/* Bedtime */
.overlay.night { background: #06070B; }
.overlay.night::before { background: radial-gradient(50% 40% at 50% 20%, rgba(255,200,110,.10), transparent 70%); }
.moon { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset -14px -6px 0 0 var(--gold-hi); transform: rotate(-20deg); justify-self: center; opacity: .9; }

/* Learn */
.lvl { display: flex; gap: 5px; }
.lvl i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--line); }
.lvl i.on { background: var(--gold); }
.memo-line { font-family: var(--display); font-size: 23px; line-height: 1.5; }
.gap { display: inline-block; min-width: 2.6em; border-bottom: 1.5px solid var(--gold); color: transparent; line-height: 1.1; padding: 0 2px; cursor: pointer; }
.gap.shown { color: var(--gold-hi); border-bottom-color: transparent; }
.hidden-line { color: transparent; text-shadow: 0 0 12px rgba(237,229,210,.5); cursor: pointer; user-select: none; }

/* Library */
.depth { display: grid; gap: 8px; padding-block: 18px; border-top: 1px solid var(--line); }
.depth .dh { display: flex; align-items: baseline; gap: 12px; }
.depth .n { font-family: var(--inscr); font-size: 22px; color: var(--gold); line-height: 1; }
.depth h3 { font-size: 23px; }
.depth p { font-size: 16.5px; line-height: 1.65; color: #E3DBC8; }
.depth p + p { margin-top: 10px; }
.depth ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: #E3DBC8; }
.depth a { color: var(--gold-hi); }
.depth .tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; justify-self: start; }
.why { border-left: 2px solid var(--gold); padding: 4px 0 4px 16px; display: grid; gap: 8px; }
.why p { font-family: var(--display); font-size: 20px; line-height: 1.45; font-style: italic; }
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 3px; background: var(--line); }
.meter i.on { background: var(--gold); }

/* Community */
.wall-item { display: grid; gap: 8px; }
.wall-item p { font-family: var(--display); font-size: 19px; line-height: 1.4; }
.wall-item .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.prayed { font-size: 13px; border: 1px solid var(--gold); color: var(--gold-hi); padding: 6px 12px; border-radius: 2px; }
.prayed[aria-pressed="true"] { background: var(--gold); color: #1A1406; }
.member { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 500 13px/1 var(--inscr); border: 1px solid var(--gold); color: var(--gold-hi); }
.member .main { flex: 1; }
.marks { display: flex; gap: 4px; }
.marks i { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid var(--line); }
.marks i.on { background: var(--gold); border-color: var(--gold); }
.big-number { font-family: var(--display); font-size: 44px; line-height: 1; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
video.parish { width: 100%; max-width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line); display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px; }

/* Entrance: crossing the threshold */
.entrance { position: fixed; inset: 0; z-index: 30; background: radial-gradient(60% 50% at 50% 38%, #171A2C 0%, #07080C 70%); display: grid; place-items: center; padding: 24px; padding-top: env(safe-area-inset-top, 24px); overflow: hidden; transition: opacity 1s ease; }
.entrance.leaving { opacity: 0; pointer-events: none; }
.entrance .door { width: min(78vw, 340px); display: grid; justify-items: center; gap: 22px; text-align: center; }
.entrance svg.arch { width: 100%; height: auto; overflow: visible; }
.entrance .arch .line { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 2.6s ease forwards; }
.entrance .arch .line.inner { stroke-opacity: .5; animation-delay: .5s; }
.entrance .arch .window { opacity: 0; animation: glow 2.4s ease 1.6s forwards; transform-box: fill-box; transform-origin: center; }
.entrance .light { position: absolute; left: 50%; top: 18%; width: 140%; height: 90%; transform: translateX(-50%); pointer-events: none; opacity: 0; animation: rays 3s ease 2.2s forwards;
  background: conic-gradient(from 160deg at 50% 0%, transparent 0deg, color-mix(in srgb, var(--season) 30%, transparent) 10deg, transparent 18deg, rgba(108,141,224,.18) 24deg, transparent 32deg, rgba(235,209,150,.18) 38deg, transparent 46deg); mask: linear-gradient(#000, transparent 85%); }
.entrance .words { display: grid; gap: 10px; opacity: 0; animation: rise 1.4s ease 2.8s forwards; }
.entrance .words h2 { font-size: 32px; }
.entrance .words p { font-family: var(--display); font-style: italic; font-size: 18px; color: #D9D0BC; }
.entrance .btn { width: auto; padding: 14px 34px; opacity: 0; animation: rise 1s ease 3.6s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes glow { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes rays { to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.welcome-list { display: grid; gap: 14px; }
.welcome-list .item { display: flex; gap: 14px; align-items: flex-start; }
.welcome-list .item svg { width: 22px; height: 22px; color: var(--gold); flex: none; margin-top: 3px; }
.welcome-list b { font-family: var(--display); font-size: 20px; font-weight: 500; display: block; }
.welcome-list span { font-size: 14.5px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #EDE5D2; color: #14151E; padding: 12px 18px; border-radius: 2px; font-size: 14.5px; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 10px 30px -10px rgba(0,0,0,.6); }

@media (prefers-reduced-motion: reduce) {
  .glass, .breath, .flame, .step { animation: none !important; }
  .entrance *, .entrance .arch .line { animation-duration: .01s !important; animation-delay: 0s !important; }
}
</style>

<script>
/* ================= Storage (per device; the app works without it) ================= */
const KEY = "abide.v1";
let store = { days: {}, learned: {}, prayedFor: {} };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function dayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today() { return store.days[dayKey()] || { prayed: [], intention: "" }; }
function setToday(r) { store.days[dayKey()] = r; save(); }
function rhythmDays() {
  let d = new Date(), n = 0;
  if (!(store.days[dayKey(d)] || {}).prayed?.length) d.setDate(d.getDate() - 1);
  while ((store.days[dayKey(d)] || {}).prayed?.length) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

  if (t >= addDays(E, -46) && t < addDays(E, -7)) return S("Lent", "#6B4A9E", "Forty days of turning back to God");
  if (t >= addDays(E, -7) && t < E) return S("Holy Week", "#A33A3A", "The last days of Jesus' life");

  if (t >= xmas) return S("Christmas", "#C9A227", "Twelve days of celebrating God with us");

}
function themeFor(d = new Date()) {
  const y = d.getFullYear(), t = new Date(y, d.getMonth(), d.getDate()), E = easter(y);
  const movables = [[-46, "ash-wednesday"], [-7, "palm-sunday"], [-3, "maundy-thursday"], [-2, "good-friday"], [-1, "holy-saturday"], [0, "easter"], [39, "ascension"], [49, "pentecost"], [56, "trinity"]];

  if (d.libseg) { libSeg = d.libseg; return render(); }

/* ================= The daily practice ================= */
let session = null, silenceTimer = null;
function startPrayer(id) {
  const o = OFFICES.find(x => x.id === id);
  const steps = [...o.seeker, ...(store.prayDefault ? o.pray.map(type => ({ type })) : [{ type: "choice" }])];
  session = { o, steps, i: 0, answers: {}, lit: false, prayed: !!store.prayDefault };
  openOverlay(id === "compline");
  drawStep();
}
function breathHTML(st) {
  return `<span class="rubric">${st.label}</span><div class="silence"><p class="prayer-text">${st.text}</p><div class="breath" aria-hidden="true"></div><span class="count" id="count">${st.secs}s</span>${st.note ? `<p class="hint">${st.note}</p>` : ""}</div>`;
}
function drawStep() {
  const { o, steps, i } = session, st = steps[i], last = i === steps.length - 1;
  clearInterval(silenceTimer);
  const title = session.prayed ? o.prayTitle : o.title;
  ovBar.innerHTML = `<button class="close" id="ov-close">Close</button><span class="prog"><i style="width:${((i + 1) / steps.length) * 100}%"></i></span><span class="ttl" style="flex:none">${title}</span>`;
  let html = "", btn = "Continue", foot = null;
  switch (st.type) {
    case "candle":
      html = `<div style="text-align:center;display:grid;gap:14px;justify-items:center"><span class="rubric">${o.title} · ${THEME.title}</span>
        <div class="candle ${session.lit ? "lit" : ""}"><span class="halo"></span><span class="flame"></span></div>
        <p class="prayer-text" style="margin-top:18px">${session.lit ? st.text : "Light the candle."}</p></div>`;
      btn = session.lit ? "Begin" : "Light the candle"; break;
    case "text": html = `<span class="rubric">${st.label}</span>${st.body}`; break;
    case "breath": html = breathHTML(st); break;
    case "idea": html = `<span class="rubric">Today's idea · ${THEME.title}</span><p class="prayer-text big illum">${THEME.reading.text}</p><span class="src">${THEME.reading.ref}</span>${ornament()}<p class="hint">${THEME.line}</p>`; break;
    case "write": html = `<span class="rubric">${st.label}</span><p class="prayer-text">${st.prompt}</p><label class="hint" for="ans">Write a few words, or simply think them.</label><textarea id="ans" placeholder="A few words…">${esc(session.answers[st.key] || "")}</textarea>`; break;
    case "return": { const it = today().intention;
      html = `<span class="rubric">Return</span><p class="prayer-text">${it ? "This morning you said you would build:" : "What is the one thing that matters most this afternoon?"}</p>${it ? `<p class="prayer-text" style="color:var(--gold-hi);font-style:italic">“${esc(it)}”</p><p class="hint">Is there still time for it today?</p>` : ""}`; break; }
    case "choice":
      html = `<div style="text-align:center;display:grid;gap:16px;padding-top:4vh"><span class="label">Go deeper</span><p class="prayer-text big">Would you like to pray it?</p>
        <p class="muted">Every moment in Abide has a Christian prayer underneath it, prayed for centuries at this hour. It takes ${o.id === "midday" ? "a minute" : "three minutes"}. You can simply read it, and see.</p></div>`;
      foot = `<div class="btns"><button class="btn" id="prayit">Pray it</button><button class="btn ghost" id="finish">Finish here</button></div>`; break;
    case "opening": html = `<span class="rubric">${o.prayTitle} · The opening</span><p class="prayer-text big">${o.opening[0]}</p><p class="prayer-text big response">${o.opening[1]}</p><p class="hint">Lines in gold are yours to say, aloud or in your heart.</p>`; break;
    case "psalm": html = `<span class="rubric">The psalm</span><p class="prayer-text big illum">${o.psalm.text}</p><span class="src">${o.psalm.ref}</span>${ornament()}<p class="prayer-text response" style="font-size:20px">${GLORIA}</p>`; break;
    case "reading": html = `<span class="rubric">The word · ${THEME.title}</span><p class="prayer-text big">${o.reading.text}</p><span class="src">${o.reading.ref}</span>`; break;
    case "silence": html = breathHTML({ label: "Silence", secs: 60, text: "Be still, and know that I am God." }); break;
    case "lords": html = `<span class="rubric">The Lord's Prayer</span><p class="hint">The prayer Jesus taught his friends, said by Christians every day for two thousand years.</p><p class="prayer-text response">${LORDS_PRAYER}</p>`; break;
    case "closing": html = `<span class="rubric">The blessing</span><p class="prayer-text big">${o.closing}</p>${ornament()}${musicCard(o.music, "To stay a while")}`; break;
  }
  ovBody.innerHTML = `<div class="ov-inner step">${html}</div>`;
  ovBody.scrollTop = 0;
  ovFoot.innerHTML = foot || `<button class="btn" id="next">${last ? (session.prayed ? "Amen" : "Finish") : btn}</button>`;
  if (st.type === "breath" || st.type === "silence") {
    let left = st.secs || 60; const c = document.getElementById("count");
    silenceTimer = setInterval(() => { left--; if (c) c.textContent = left > 0 ? left + "s" : "Continue when you are ready."; if (left <= 0) { clearInterval(silenceTimer); ringBell(); } }, 1000);
  }
}
function finishPractice() {
  const r = today(), o = session.o, a = session.answers;
  if (!r.prayed.includes(o.id)) r.prayed.push(o.id);
  if (a.intention) r.intention = a.intention;
  if (o.id === "evening") r.examen = [a.e0, a.e1, a.e2];
  setToday(r);
  const name = session.prayed ? o.prayTitle : o.title; session = null;
  closeOverlay(); toast(`${name}: done. Go in peace.`);
}
ovFoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeOverlay();
  if (!session) return;
  const st = session.steps[session.i];
  if (e.target.closest("#prayit")) { session.prayed = true; session.steps.splice(session.i, 1, ...session.o.pray.map(type => ({ type }))); ringBell(); return drawStep(); }
  if (e.target.closest("#finish")) return finishPractice();
  if (!e.target.closest("#next")) return;
  if (st.type === "candle" && !session.lit) { session.lit = true; ringBell(); return drawStep(); }
  const ta = document.getElementById("ans"); if (ta && st.key) session.answers[st.key] = ta.value.trim();
  if (session.i < session.steps.length - 1) { session.i++; return drawStep(); }
  finishPractice();
});

/* ================= Learn by heart ================= */
function level(id) { return store.learned[id] || 0; }
function renderLearn() {
  const next = [...MEMORY].sort((a, b) => level(a.id) - level(b.id))[0];
  view.innerHTML = `
    <header class="page-top"><span class="label">Learn by heart</span><h1>Words to carry</h1><p>Prayers, psalms, hymns and poems people once knew by heart, for the hospital corridor, the graveside and 3am. A minute a day.</p></header>
    <button class="stone" data-mem="${next.id}" style="border-color:var(--gold)"><span class="label">Practise today</span><h2 style="font-size:27px">${next.title}</h2><p class="muted small">${next.kind} · ${next.lines.length} lines</p></button>
    <div class="list">${MEMORY.map(m => `
      <button class="row" data-mem="${m.id}"><span class="main"><b>${m.title}</b><span>${m.kind} · ${m.src}</span></span>
      <span class="lvl" aria-label="Progress ${level(m.id)} of 4">${[0, 1, 2, 3].map(k => `<i class="${k < level(m.id) ? "on" : ""}"></i>`).join("")}</span></button>`).join("")}</div>
    <p class="hint" style="text-align:center">Four steps: read it, fill the gaps, first letters only, then say it from memory.</p>`;
}
function openMemory(id) {
  const m = MEMORY.find(x => x.id === id);
  let mode = Math.min(level(id), 3), revealed = 0;
  const modes = ["Read", "Gaps", "First letters", "From memory"];
  openOverlay();
  const word = (w, j, li) => {
    const core = w.replace(/[^A-Za-zÀ-ÿ']/g, "");
    if (mode === 1 && core.length > 2 && (j + li) % 3 === 1) return w.replace(core, `<span class="gap" role="button" tabindex="0">${core}</span>`);
    if (mode === 2) return w.replace(core, core ? `<span class="gap" role="button" tabindex="0" style="min-width:0;color:var(--ink)">${core[0]}</span><span class="rest" hidden>${core.slice(1)}</span>` : "");
    return w;
  };
  const draw = () => {
    ovBar.innerHTML = `<button class="close" id="ov-close">Close</button><span class="ttl">${m.title}</span><span style="width:40px"></span>`;
    let text;
    if (mode === 3) text = m.lines.map((l, i) => `<p class="memo-line ${i < revealed ? "" : "hidden-line"}" data-line="${i}">${l}</p>`).join("");
    else text = m.lines.map((l, li) => `<p class="memo-line">${l.split(" ").map((w, j) => word(w, j, li)).join(" ")}</p>`).join("");
    const tip = ["Read it slowly, aloud if you can.", "Say each line, then tap a gap to check.", "Each word shows only its first letter. Tap to reveal.", "Say each line from memory, then tap to check."][mode];
    ovBody.innerHTML = `<div class="ov-inner">
      <div class="seg" role="group" aria-label="Practice step">${modes.map((l, i) => `<button data-mode="${i}" aria-pressed="${i === mode}">${i + 1}. ${l}</button>`).join("")}</div>
      <p class="hint">${tip}</p><div class="step">${text}</div><span class="src">${m.src}</span></div>`;
    ovFoot.innerHTML = mode === 3 && revealed < m.lines.length ? `<button class="btn ghost" id="reveal">Check next line</button>` : `<button class="btn" id="know">${mode < 3 ? "I have it. Next step" : "I know it by heart"}</button>`;
  };
  ovBody.onclick = e => {
    const md = e.target.closest("[data-mode]"); if (md) { mode = +md.dataset.mode; revealed = 0; return draw(); }
    const g = e.target.closest(".gap"); if (g) { g.classList.add("shown"); const r = g.nextElementSibling; if (r && r.classList.contains("rest")) { r.hidden = false; g.style.color = "var(--gold-hi)"; } return; }
    const ln = e.target.closest("[data-line]"); if (ln && +ln.dataset.line === revealed) { revealed++; draw(); }
  };
  ovFoot.onclick = e => {
    if (e.target.closest("#reveal")) { revealed++; return draw(); }
    if (e.target.closest("#know")) {
      store.learned[id] = Math.max(level(id), mode + 1); save();
      if (mode < 3) { mode++; revealed = 0; return draw(); }
      ringBell(); toast(m.title + ": learned by heart. Come back in a few days to keep it.");
      closeOverlay();
    }
  };
  draw();
}
