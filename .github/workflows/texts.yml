# Public-domain texts from Project Gutenberg for the journeys, kept on the texts-cache branch.
name: Texts
on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths: [tools/texts/**]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/texts/fetch.mjs
      - name: Publish to the texts-cache branch
        run: |
          cd .cache/texts
          git init -q -b texts-cache && git add .
          git -c user.name="Rose Window bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Texts from Project Gutenberg"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" texts-cache
