# Builds the site and publishes it to GitHub Pages on every push to main or staging,
# and every morning: rebuilds (so the day's picture and share page exist) and sends the daily email.
# main is the live site. The staging branch is built into /staging/ beside it: same site, hidden from search,
# no analytics, its own storage on the device. Check changes there, then merge staging into main. See EDITING.md.
name: Deploy Pew
on:
  push:
    branches: [main, staging]
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC: 06:15 in Berlin in summer, 05:15 in winter (GitHub may run it a little late)
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also send today's email"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  TZ: Europe/Berlin
jobs:
  # GitHub Pages only publishes from main, so a push to staging asks main's workflow to rebuild (it builds both copies).
  staging-push:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the picture renderer
        run: npm install --no-save --no-package-lock playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Restore the paintings
        uses: actions/cache@v4
        with:
          path: .cache/art
          key: art-${{ hashFiles('content/art.json') }}
          restore-keys: art-
      - run: node build.mjs
      - name: Paintings (served by Pew itself)
        run: node art.mjs
      - name: Today's idea (pictures, share pages, email)
        run: node daily.mjs
      - name: Is there a staging branch?
        id: stg
        run: echo "exists=$(git ls-remote --heads origin staging | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.stg.outputs.exists != '0'
        with:
          ref: staging
          path: staging-src
      - name: Staging copy, into /staging/
        if: steps.stg.outputs.exists != '0'
        working-directory: staging-src
        env:
          PEW_STAGING: "1"
        run: |
          mkdir -p .cache && cp -r ../.cache/art .cache/art
          ln -s ../node_modules node_modules || true
          node build.mjs
          node art.mjs || echo "::warning::Some staging paintings could not be downloaded"
          node daily.mjs --back 0 --ahead 1
          rm -rf ../dist/staging && cp -r dist ../dist/staging
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  email:
    needs: deploy
    if: github.event_name == 'schedule' || inputs.send_email
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs && node daily.mjs --no-images --back 0 --ahead 0
      - name: Send today's email
        run: node daily/send.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
