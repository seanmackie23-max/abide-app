# Cloudflare Worker for the Pew relay. Deployed by GitHub Actions ("Deploy the relay", see LAUNCH.md),
# which also fills in ALLOWED_ORIGINS, SITE_URL, EMAIL_FROM and RESEND_SEGMENT_ID from site.json and the repository settings.
# By hand instead: npx wrangler deploy, then npx wrangler secret put RESEND_API_KEY (and TOKEN_SECRET).
name = "pew-relay"
main = "cloudflare-worker.mjs"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://seanmackie23-max.github.io"
MODEL = "claude-haiku-4-5-20251001"
RATE_PER_10_MIN = "30"
FREE_ASK_PER_DAY = "5"
FREE_PATH_PER_DAY = "3"
FREE_COACH_PER_DAY = "3"
# Secrets (not here): ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, TOKEN_SECRET

# Community (circles, "I'm going"): create a KV namespace and bind it.
#   npx wrangler kv namespace create ABIDE_KV   then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "ABIDE_KV"
# id = "<your namespace id>"
